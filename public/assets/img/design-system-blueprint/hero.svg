<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="title desc"><desc>Shared design foundations inform locally adapted product systems, which connect to implementation guidance. Learning from product teams flows back to improve the shared foundations.</desc><defs><marker id="a" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="9" refY="6"><path fill="none" stroke="#8b7be0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 9 5-9 5"/></marker><marker id="b" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="9" refY="6"><path fill="none" stroke="#55a77d" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 9 5-9 5"/></marker></defs><path fill="#f7f8fa" d="M0 0h1600v1000H0z"/><text x="90" y="80" fill="#536174" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">DESIGN SYSTEMS · ECOSYSTEM MODEL</text><text x="90" y="145" fill="#172033" font-family="Arial,sans-serif" font-size="46" font-weight="700">Shared foundations, adapted to real product needs</text><text x="90" y="193" fill="#596579" font-family="Arial,sans-serif" font-size="21">A connected model for coherence across products with different audiences and technical contexts.</text><g font-family="Arial,sans-serif"><rect width="380" height="350" x="100" y="330" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="28"/><rect width="380" height="100" x="100" y="330" fill="#eeeaff" rx="28"/><path fill="#eeeaff" d="M100 402v28h380v-28"/><text x="140" y="374" fill="#7664d8" font-size="15" font-weight="700" letter-spacing="2">01 · COMMON GROUND</text><text x="140" y="410" fill="#252d40" font-size="27" font-weight="700">Shared foundations</text><text x="140" y="490" fill="#30364a" font-size="18" font-weight="700">Principles &amp; visual foundations</text><text x="140" y="527" fill="#596579" font-size="16">Common language, reusable styles</text><text x="140" y="551" fill="#596579" font-size="16">and guidance for broad use</text><path stroke="#e6e3f5" stroke-width="2" d="M140 580h300"/><text x="140" y="621" fill="#7664d8" font-size="15">A starting point—not a one-size-fits-all rule</text><rect width="380" height="350" x="610" y="330" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="28"/><rect width="380" height="100" x="610" y="330" fill="#f0f1ff" rx="28"/><path fill="#f0f1ff" d="M610 402v28h380v-28"/><text x="650" y="374" fill="#625db7" font-size="15" font-weight="700" letter-spacing="2">02 · LOCAL FIT</text><text x="650" y="410" fill="#252d40" font-size="27" font-weight="700">Product systems</text><text x="650" y="490" fill="#30364a" font-size="18" font-weight="700">Adapted to each context</text><text x="650" y="527" fill="#596579" font-size="16">Local patterns and components</text><text x="650" y="551" fill="#596579" font-size="16">where users or technology differ</text><path stroke="#e6e3f5" stroke-width="2" d="M650 580h300"/><text x="650" y="621" fill="#625db7" font-size="15">Reuse where it helps; adapt where needed</text><rect width="380" height="350" x="1120" y="330" fill="#fff" stroke="#cfe6d9" stroke-width="2" rx="28"/><rect width="380" height="100" x="1120" y="330" fill="#eaf5ef" rx="28"/><path fill="#eaf5ef" d="M1120 402v28h380v-28"/><text x="1160" y="374" fill="#438462" font-size="15" font-weight="700" letter-spacing="2">03 · IN USE</text><text x="1160" y="410" fill="#252d40" font-size="27" font-weight="700">Guidance &amp; delivery</text><text x="1160" y="490" fill="#30364a" font-size="18" font-weight="700">Clear routes to implementation</text><text x="1160" y="527" fill="#596579" font-size="16">Examples, usage guidance and</text><text x="1160" y="551" fill="#596579" font-size="16">links that help teams apply the system</text><path stroke="#dcece2" stroke-width="2" d="M1160 580h300"/><text x="1160" y="621" fill="#438462" font-size="15">Connect design intent to product work</text></g><g fill="none" stroke="#8b7be0" stroke-linecap="round" stroke-width="4" marker-end="url(#a)"><path d="M490 505h100"/><path d="M1000 505h100"/></g><text x="540" y="475" fill="#7664d8" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">GUIDES</text><text x="1050" y="475" fill="#7664d8" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">ENABLES</text><path fill="none" stroke="#55a77d" stroke-linecap="round" stroke-width="4" marker-end="url(#b)" d="M1310 715c-50 135-910 135-1020 0"/><rect width="350" height="70" x="625" y="800" fill="#eaf5ef" rx="20"/><text x="800" y="830" fill="#438462" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1" text-anchor="middle">LEARN FROM PRODUCT TEAMS</text><text x="800" y="853" fill="#596579" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Use feedback to evolve shared guidance</text><rect width="1400" height="54" x="100" y="900" fill="#172033" rx="16"/><text x="140" y="935" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">Design principle:</text><text x="300" y="935" fill="#e4e7f0" font-family="Arial,sans-serif" font-size="18">aim for coherence across the ecosystem, while respecting meaningful product differences.</text><text x="100" y="982" fill="#7b8493" font-family="Arial,sans-serif" font-size="14">Illustrative model · generic labels only · not a representation of any company’s actual systems or architecture</text></svg>