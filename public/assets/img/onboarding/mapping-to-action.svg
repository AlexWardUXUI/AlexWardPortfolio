<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><path fill="#f7f8fa" d="M0 0h1600v900H0z"/><text x="100" y="105" fill="#536174" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">SERVICE DESIGN · 03</text><text x="100" y="175" fill="#172033" font-family="Arial,sans-serif" font-size="52" font-weight="700">Turning a map into action</text><text x="100" y="225" fill="#596579" font-family="Arial,sans-serif" font-size="24">The blueprint created a shared basis for prioritising service improvements</text><g font-family="Arial,sans-serif"><rect width="300" height="190" x="110" y="340" fill="#e8eaff" stroke="#7664d8" stroke-width="2" rx="24"/><text x="260" y="405" fill="#172033" font-size="24" font-weight="700" text-anchor="middle">Map</text><text x="260" y="450" fill="#596579" font-size="18" text-anchor="middle">Bring the journey,</text><text x="260" y="478" fill="#596579" font-size="18" text-anchor="middle">teams and touchpoints together</text><path stroke="#9ba6b5" stroke-width="4" d="M430 435h75"/><path fill="none" stroke="#9ba6b5" stroke-width="4" d="m495 425 15 10-15 10"/><rect width="300" height="190" x="530" y="340" fill="#fff0d9" stroke="#dca34e" stroke-width="2" rx="24"/><text x="680" y="405" fill="#172033" font-size="24" font-weight="700" text-anchor="middle">Understand</text><text x="680" y="450" fill="#596579" font-size="18" text-anchor="middle">Surface pain points,</text><text x="680" y="478" fill="#596579" font-size="18" text-anchor="middle">dependencies and gaps</text><path stroke="#9ba6b5" stroke-width="4" d="M850 435h75"/><path fill="none" stroke="#9ba6b5" stroke-width="4" d="m915 425 15 10-15 10"/><rect width="300" height="190" x="950" y="340" fill="#e3f4eb" stroke="#55a77d" stroke-width="2" rx="24"/><text x="1100" y="405" fill="#172033" font-size="24" font-weight="700" text-anchor="middle">Align</text><text x="1100" y="450" fill="#596579" font-size="18" text-anchor="middle">Build cross-team</text><text x="1