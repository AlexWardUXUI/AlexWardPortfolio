<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="title desc"><desc>An anonymised service-design synthesis showing the customer journey, cross-team activities, and recurring friction from handoffs, repeated checks, and limited end-to-end visibility.</desc><path fill="#f7f8fa" d="M0 0h1600v1000H0z"/><text x="92" y="82" fill="#536174" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">SERVICE DESIGN · ANONYMISED CASE STUDY</text><text x="92" y="145" fill="#172033" font-family="Arial,sans-serif" font-size="44" font-weight="700">Onboarding was a connected service,</text><text x="92" y="198" fill="#172033" font-family="Arial,sans-serif" font-size="44" font-weight="700">but teams experienced it in separate parts</text><text x="92" y="243" fill="#596579" font-family="Arial,sans-serif" font-size="21">The blueprint made dependencies and friction visible across the end-to-end experience.</text><g fill="#697487" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.5"><text x="92" y="312">SERVICE STAGE</text><text x="430" y="312">CUSTOMER EXPERIENCE</text><text x="815" y="312">CROSS-TEAM DELIVERY</text><text x="1250" y="312">FRICTION REVEALED</text></g><rect width="1440" height="440" x="80" y="332" fill="#fff" stroke="#e3e7ed" rx="18"/><path stroke="#e5e9ef" d="M400 332v440m385-440v440m440-440v440"/><path stroke="#edf0f4" d="M80 442h1440M80 552h1440M80 662h1440"/><g fill="#263247" font-family="Arial,sans-serif" font-size="19" font-weight="700"><text x="110" y="392">1 · Align on needs</text><text x="110" y="502">2 · Gather &amp; prepare</text><text x="110" y="612">3 · Configure &amp; validate</text><text x="110" y="722">4 · Complete onboarding</text></g><g fill="#465268" font-family="Arial,sans-serif" font-size="17"><text x="430" y="378">Shares context and goals</text><text x="430" y="405" fill="#788395" font-size="15">Needs a clear starting point</text><text x="430" y="488">Provides required information</text><text x="430" y="515" fill="#788395" font-size="15">May need to correct or clarify</text><text x="430" y="598">Waits while setup is checked</text><text x="430" y="625" fill="#788395" font-size="15">Progress can feel hard to track</text><text x="430" y="708">Moves toward a usable service</text><text x="430" y="735" fill="#788395" font-size="15">Handoffs shape first impressions</text></g><g font-family="Arial,sans-serif" font-size="15" text-anchor="middle"><rect width="170" height="52" x="815" y="354" fill="#e9eaff" rx="12"/><text x="900" y="376" fill="#3f3a78" font-weight="700">Customer-facing</text><text x="900" y="395" fill="#596579">understand &amp; coordinate</text><rect width="195" height="52" x="1000" y="354" fill="#f0edff" rx="12"/><text x="1097" y="376" fill="#3f3a78" font-weight="700">Product / support</text><text x="1097" y="395" fill="#596579">clarify requirements</text><rect width="170" height="52" x="815" y="464" fill="#e9eaff" rx="12"/><text x="900" y="486" fill="#3f3a78" font-weight="700">Implementation</text><text x="900" y="505" fill="#596579">prepare information</text><rect width="195" height="52" x="1000" y="464" fill="#f0edff" rx="12"/><text x="1097" y="486" fill="#3f3a78" font-weight="700">Specialist teams</text><text x="1097" y="505" fill="#596579">review &amp; resolve</text><rect width="170" height="52" x="815" y="574" fill="#e9eaff" rx="12"/><text x="900" y="596" fill="#3f3a78" font-weight="700">Implementation</text><text x="900" y="615" fill="#596579">configure the service</text><rect width="195" height="52" x="1000" y="574" fill="#f0edff" rx="12"/><text x="1097" y="596" fill="#3f3a78" font-weight="700">Product / support</text><text x="1097" y="615" fill="#596579">check readiness</text><rect width="170" height="52" x="815" y="684" fill="#e9f5ee" rx="12"/><text x="900" y="706" fill="#286947" font-weight="700">Customer-facing</text><text x="900" y="725" fill="#596579">confirm next steps</text><rect width="195" height="52" x="1000" y="684" fill="#e9f5ee" rx="12"/><text x="1097" y="706" fill="#286947" font-weight="700">Connected teams</text><text x="1097" y="725" fill="#596579">support transition</text></g><path fill="none" stroke="#9d91e7" stroke-dasharray="6 6" stroke-width="2.5" d="M985 380c20 40-5 65 15 110m97 26c-27 24-172 24-197 58m85 26c20 50-5 70 15 110"/><g font-family="Arial,sans-serif"><rect width="245" height="96" x="1250" y="354" fill="#fff4e8" rx="14"/><circle cx="1275" cy="382" r="8" fill="#d98d38"/><text x="1294" y="388" fill="#453a2e" font-size="17" font-weight="700">Limited shared view</text><text x="1270" y="420" fill="#695d51" font-size="15">Dependencies were hard to see</text><rect width="245" height="96" x="1250" y="466" fill="#fff4e8" rx="14"/><circle cx="1275" cy="494" r="8" fill="#d98d38"/><text x="1294" y="500" fill="#453a2e" font-size="17" font-weight="700">Repeated checking</text><text x="1270" y="532" fill="#695d51" font-size="15">Extra effort and rework</text><rect width="245" height="96" x="1250" y="578" fill="#fff0f0" rx="14"/><circle cx="1275" cy="606" r="8" fill="#cd6262"/><text x="1294" y="612" fill="#453a2e" font-size="17" font-weight="700">Handoff friction</text><text x="1270" y="644" fill="#695d51" font-size="15">Waiting and unclear ownership</text><rect width="245" height="60" x="1250" y="690" fill="#f3f4f7" rx="14"/><text x="1270" y="716" fill="#485266" font-size="15" font-weight="700">Customer impact</text><text x="1270" y="738" fill="#667185" font-size="14">A slower, less predictable start</text></g><rect width="1440" height="92" x="80" y="815" fill="#172033" rx="18"/><text x="112" y="853" fill="#b9c3ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">DESIGN INSIGHT</text><text x="310" y="853" fill="#fff" font-family="Arial,sans-serif" font-size="20">The core challenge was not one broken step—it was the lack of a shared view across the service.</text><text x="310" y="883" fill="#d1d7e1" font-family="Arial,sans-serif" font-size="16">Blueprinting connected customer experience, team activity and operational dependencies to frame improvement.</text><text x="80" y="960" fill="#7b8493" font-family="Arial,sans-serif" font-size="14">Illustrative reconstruction based on portfolio evidence · anonymised labels · not the original process or system logic</text></svg>