<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900"><path fill="#f7f8fa" d="M0 0h1600v900H0z"/><text x="100" y="105" fill="#536174" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3">SERVICE DESIGN · 02</text><text x="100" y="175" fill="#172033" font-family="Arial,sans-serif" font-size="52" font-weight="700">Where friction gathered</text><text x="100" y="225" fill="#596579" font-family="Arial,sans-serif" font-size="24">Workshop synthesis grouped recurring issues into three service themes</text><g font-family="Arial,sans-serif"><rect width="430" height="350" x="100" y="320" fill="#fff" rx="26"/><circle cx="165" cy="390" r="28" fill="#fbe7cc"/><path stroke="#bc7625" stroke-width="4" d="M153 390h24m-12-12v24"/><text x="145" y="465" fill="#172033" font-size="27" font-weight="700">Handoffs</text><text x="145" y="515" fill="#596579" font-size="20">Ownership and information</text><text x="145" y="545" fill="#596579" font-size="20">did not always travel together.</text><text x="145" y="620" fill="#8a6370" font-size="16">Opportunity: clarify the joins</text><rect width="430" height="350" x="585" y="320" fill="#fff" rx="26"/><circle cx="650" cy="390" r="28" fill="#e9e6ff"/><path stroke="#7664d8" stroke-width="4" d="M638 390h24m-12-12v24"/><text x="630" y="465" fill="#172033" font-size="27" font-weight="700">Repeated effort</text><text x="630" y="515" fill="#596579" font-size="20">Teams faced extra checking</text><text x="630" y="545" fill="#596579" font-size="20">and avoidable rework.</text><text x="630" y="620" fill="#8a6370" font-size="16">Opportunity: simplify the path</text><rect width="430" height="350" x="1070" y="320" fill="#fff" rx="26"/><circle cx="1135" cy="390" r="28" fill="#fde4e4"/><path stroke="#c45151" stroke-width="4" d="M1123 390h24m-12-12v24"/><text x="1115" y="465" fill="#172033" font-size="27" font-weight="700">Delays</text><text x="1115" y="515" fill="#596579" font-size="20">Slow or disconnected steps</text><text x="1115" y="545" fill="#596579" font-size="20">could affect the first experience.</text><text x="1115" y="620" fill="#8a6370" font-size="16">Opportunity: reduce waiting</text></g><text x="100" y="765" fill="#384358" font-family="Arial,sans-serif" font-size="19" font-weight="700">A shared view helped teams discuss the service as a whole—not just their own step.</text><text x="100" y="830" fill="#7b8493" font-family="Arial,sans-serif" font-size="16">Generalised themes · no internal tools, data types or operational rules shown</text></svg>