<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="title desc"><desc>An abstract continuum showing reusable foundations, configurable shared components, and product-specific compositions.</desc><defs><marker id="a" markerHeight="12" markerWidth="12" orient="auto" refX="9" refY="6"><path fill="none" stroke="#8b7be0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 9 5-9 5"/></marker></defs><path fill="#f7f8fa" d="M0 0h1600v1000H0z"/><text x="90" y="78" fill="#536174" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">DESIGN SYSTEMS · COMPONENT MODEL</text><text x="90" y="143" fill="#172033" font-family="Arial,sans-serif" font-size="45" font-weight="700">One foundation, different product needs</text><text x="90" y="190" fill="#596579" font-family="Arial,sans-serif" font-size="21">Components can move from broadly shared foundations to more tailored product experiences.</text><path stroke="#8b7be0" stroke-width="4" marker-end="url(#a)" d="M210 300h1180"/><text x="210" y="265" fill="#7664d8" font-family="Arial,sans-serif" font-size="17" font-weight="700">MORE SHARED</text><text x="1390" y="265" fill="#625db7" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="end">MORE PRODUCT-SPECIFIC</text><g font-family="Arial,sans-serif"><rect width="430" height="355" x="90" y="365" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="26"/><rect width="430" height="90" x="90" y="365" fill="#eeeaff" rx="26"/><path fill="#eeeaff" d="M90 430v25h430v-25z"/><text x="130" y="410" fill="#7664d8" font-size="15" font-weight="700" letter-spacing="1.5">FOUNDATION</text><text x="130" y="500" fill="#252d40" font-size="25" font-weight="700">Shared design rules</text><text x="130" y="548" fill="#596579" font-size="17">Common styles and principles</text><text x="130" y="576" fill="#596579" font-size="17">that provide a consistent starting</text><text x="130" y="604" fill="#596579" font-size="17">point across products.</text><path stroke="#e6e3f5" stroke-width="2" d="M130 638h350"/><text x="130" y="678" fill="#7664d8" font-size="15">Use broadly when the context fits</text><rect width="430" height="355" x="585" y="365" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="26"/><rect width="430" height="90" x="585" y="365" fill="#f0f1ff" rx="26"/><path fill="#f0f1ff" d="M585 430v25h430v-25z"/><text x="625" y="410" fill="#625db7" font-size="15" font-weight="700" letter-spacing="1.5">REUSABLE COMPONENT</text><text x="625" y="500" fill="#252d40" font-size="25" font-weight="700">Configurable building block</text><text x="625" y="548" fill="#596579" font-size="17">A shared component with clear</text><text x="625" y="576" fill="#596579" font-size="17">behaviour and options for common</text><text x="625" y="604" fill="#596579" font-size="17">product variations.</text><path stroke="#e6e3f5" stroke-width="2" d="M625 638h350"/><text x="625" y="678" fill="#625db7" font-size="15">Adapt within agreed boundaries</text><rect width="430" height="355" x="1080" y="365" fill="#fff" stroke="#cfe6d9" stroke-width="2" rx="26"/><rect width="430" height="90" x="1080" y="365" fill="#eaf5ef" rx="26"/><path fill="#eaf5ef" d="M1080 430v25h430v-25z"/><text x="1120" y="410" fill="#438462" font-size="15" font-weight="700" letter-spacing="1.5">PRODUCT EXPERIENCE</text><text x="1120" y="500" fill="#252d40" font-size="25" font-weight="700">Context-specific composition</text><text x="1120" y="548" fill="#596579" font-size="17">Combine and tailor components</text><text x="1120" y="576" fill="#596579" font-size="17">for a distinct audience, workflow</text><text x="1120" y="604" fill="#596579" font-size="17">or technical context.</text><path stroke="#dcece2" stroke-width="2" d="M1120 638h350"/><text x="1120" y="678" fill="#438462" font-size="15">Make exceptions deliberate and clear</text></g><g fill="none" stroke="#c7c1e8" stroke-width="3" marker-end="url(#a)"><path d="M530 540h45"/><path d="M1025 540h45"/></g><rect width="1420" height="110" x="90" y="790" fill="#172033" rx="22"/><text x="130" y="835" fill="#b9c3ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">THE PRINCIPLE</text><text x="130" y="872" fill="#fff" font-family="Arial,sans-serif" font-size="20">Reuse where it improves coherence. Adapt when product needs genuinely differ.</text><text x="90" y="950" fill="#7b8493" font-family="Arial,sans-serif" font-size="14">Illustrative continuum · generic examples · no real tokens, component names or product designs shown</text></svg>