<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="title desc"><desc>A central shared component approach connects design foundations to potential benefits in accessibility, consistency, delivery efficiency, and adoption.</desc><path fill="#f7f8fa" d="M0 0h1600v1000H0z"/><text x="90" y="78" fill="#536174" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">DESIGN SYSTEMS · INTENDED VALUE</text><text x="90" y="143" fill="#172033" font-family="Arial,sans-serif" font-size="45" font-weight="700">A shared system should make good work easier</text><text x="90" y="190" fill="#596579" font-family="Arial,sans-serif" font-size="21">The component approach connected reusable foundations to practical team and product needs.</text><rect width="530" height="220" x="535" y="390" fill="#eeeaff" stroke="#cfc8ef" stroke-width="2" rx="32"/><text x="800" y="445" fill="#7664d8" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2" text-anchor="middle">SHARED DESIGN PRACTICE</text><text x="800" y="495" fill="#252d40" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle">Foundations + components</text><text x="800" y="540" fill="#596579" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">A reusable base, adapted to product context</text><g font-family="Arial,sans-serif"><rect width="350" height="170" x="90" y="300" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="24"/><circle cx="135" cy="350" r="16" fill="#8877df"/><text x="170" y="358" fill="#252d40" font-size="23" font-weight="700">More coherent UI</text><text x="130" y="405" fill="#596579" font-size="17">Reuse established patterns</text><text x="130" y="432" fill="#596579" font-size="17">instead of recreating basics.</text><rect width="350" height="170" x="90" y="555" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="24"/><circle cx="135" cy="605" r="16" fill="#8877df"/><text x="170" y="613" fill="#252d40" font-size="23" font-weight="700">Clearer accessibility</text><text x="130" y="660" fill="#596579" font-size="17">Start from components designed</text><text x="130" y="687" fill="#596579" font-size="17">with inclusive use in mind.</text><rect width="350" height="170" x="1160" y="300" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="24"/><circle cx="1205" cy="350" r="16" fill="#7777d8"/><text x="1240" y="358" fill="#252d40" font-size="23" font-weight="700">Smoother collaboration</text><text x="1200" y="405" fill="#596579" font-size="17">Give design and engineering</text><text x="1200" y="432" fill="#596579" font-size="17">a clearer shared reference.</text><rect width="350" height="170" x="1160" y="555" fill="#fff" stroke="#cfe6d9" stroke-width="2" rx="24"/><circle cx="1205" cy="605" r="16" fill="#55a77d"/><text x="1240" y="613" fill="#252d40" font-size="23" font-weight="700">Easier adoption</text><text x="1200" y="660" fill="#596579" font-size="17">Make components easier to find,</text><text x="1200" y="687" fill="#596579" font-size="17">understand and extend.</text></g><path fill="none" stroke="#bdb5e6" stroke-width="3" d="m440 385 95 55m-95 200 95-80m530-120 95-55m-95 175 95 80"/><rect width="530" height="105" x="535" y="700" fill="#eaf5ef" rx="22"/><text x="800" y="742" fill="#438462" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" text-anchor="middle">SUCCESS DEPENDS ON ADOPTION</text><text x="800" y="776" fill="#596579" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Useful guidance and team enablement bring the system into everyday work.</text><text x="90" y="890" fill="#596579" font-family="Arial,sans-serif" font-size="16">These are intended benefits of the approach, not quantified outcomes.</text><text x="90" y="950" fill="#7b8493" font-family="Arial,sans-serif" font-size="14">Illustrative value model · generic benefits only · no company or vendor-specific claims</text></svg>