<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="title desc"><desc>Four generic steps: choose a component, map visual properties to shared foundations, review its variants and states, and check completeness before progressing. Gaps return to review.</desc><defs><marker id="a" markerHeight="12" markerWidth="12" orient="auto" refX="9" refY="6"><path fill="none" stroke="#8b7be0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 9 5-9 5"/></marker><marker id="b" markerHeight="12" markerWidth="12" orient="auto" refX="9" refY="6"><path fill="none" stroke="#55a77d" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 9 5-9 5"/></marker></defs><path fill="#f7f8fa" d="M0 0h1600v1000H0z"/><text x="90" y="78" fill="#536174" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">DESIGN SYSTEMS · COMPONENT PREPARATION</text><text x="90" y="143" fill="#172033" font-family="Arial,sans-serif" font-size="45" font-weight="700">Make component adaptation repeatable</text><text x="90" y="190" fill="#596579" font-family="Arial,sans-serif" font-size="21">A consistent review helps shared components reflect design foundations across their variants.</text><g font-family="Arial,sans-serif"><rect width="320" height="300" x="90" y="300" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="26"/><rect width="320" height="84" x="90" y="300" fill="#eeeaff" rx="26"/><path fill="#eeeaff" d="M90 360v24h320v-24z"/><circle cx="132" cy="342" r="18" fill="#8877df"/><text x="132" y="348" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">1</text><text x="165" y="350" fill="#252d40" font-size="20" font-weight="700">Choose &amp; understand</text><text x="125" y="440" fill="#30364a" font-size="18" font-weight="700">Start with the component</text><text x="125" y="479" fill="#596579" font-size="16">Identify its purpose, variants</text><text x="125" y="505" fill="#596579" font-size="16">and interactive states.</text><rect width="250" height="34" x="125" y="535" fill="#f5f2ff" rx="11"/><text x="250" y="558" fill="#7664d8" font-size="14" text-anchor="middle">Scope before styling</text><rect width="320" height="300" x="470" y="300" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="26"/><rect width="320" height="84" x="470" y="300" fill="#f0f1ff" rx="26"/><path fill="#f0f1ff" d="M470 360v24h320v-24z"/><circle cx="512" cy="342" r="18" fill="#7777d8"/><text x="512" y="348" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">2</text><text x="545" y="350" fill="#252d40" font-size="20" font-weight="700">Map to foundations</text><text x="505" y="440" fill="#30364a" font-size="18" font-weight="700">Align visual properties</text><text x="505" y="479" fill="#596579" font-size="16">Connect styling choices to</text><text x="505" y="505" fill="#596579" font-size="16">shared, reusable design values.</text><rect width="250" height="34" x="505" y="535" fill="#f0f1ff" rx="11"/><text x="630" y="558" fill="#625db7" font-size="14" text-anchor="middle">Keep the source consistent</text><rect width="320" height="300" x="850" y="300" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="26"/><rect width="320" height="84" x="850" y="300" fill="#f0f1ff" rx="26"/><path fill="#f0f1ff" d="M850 360v24h320v-24z"/><circle cx="892" cy="342" r="18" fill="#7777d8"/><text x="892" y="348" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">3</text><text x="925" y="350" fill="#252d40" font-size="20" font-weight="700">Review variations</text><text x="885" y="440" fill="#30364a" font-size="18" font-weight="700">Check across use states</text><text x="885" y="479" fill="#596579" font-size="16">Look for gaps, exceptions</text><text x="885" y="505" fill="#596579" font-size="16">and inconsistent styling.</text><rect width="250" height="34" x="885" y="535" fill="#f0f1ff" rx="11"/><text x="1010" y="558" fill="#625db7" font-size="14" text-anchor="middle">Test the whole set</text><rect width="280" height="300" x="1230" y="300" fill="#fff" stroke="#cfe6d9" stroke-width="2" rx="26"/><rect width="280" height="84" x="1230" y="300" fill="#eaf5ef" rx="26"/><path fill="#eaf5ef" d="M1230 360v24h280v-24z"/><circle cx="1272" cy="342" r="18" fill="#55a77d"/><text x="1272" y="348" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">4</text><text x="1305" y="350" fill="#252d40" font-size="20" font-weight="700">Confirm readiness</text><text x="1265" y="440" fill="#30364a" font-size="18" font-weight="700">Review for completeness</text><text x="1265" y="479" fill="#596579" font-size="16">Resolve gaps before the</text><text x="1265" y="505" fill="#596579" font-size="16">component is ready to reuse.</text><rect width="210" height="34" x="1265" y="535" fill="#f1f7f3" rx="11"/><text x="1370" y="558" fill="#438462" font-size="14" text-anchor="middle">Ready to move forward</text></g><g fill="none" stroke="#8b7be0" stroke-linecap="round" stroke-width="3.5" marker-end="url(#a)"><path d="M415 450h45"/><path d="M795 450h45"/><path d="M1175 450h45"/></g><path fill="none" stroke="#55a77d" stroke-dasharray="8 8" stroke-linecap="round" stroke-width="3" marker-end="url(#b)" d="M1370 620v65h-360v-65"/><rect width="560" height="54" x="735" y="666" fill="#eaf5ef" rx="16"/><text x="1015" y="700" fill="#438462" font-family="Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle">If review finds a gap, refine the mapping and check again.</text><rect width="1420" height="112" x="90" y="770" fill="#172033" rx="22"/><text x="130" y="814" fill="#b9c3ff" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">WHY THE METHOD MATTERS</text><text x="130" y="850" fill="#fff" font-family="Arial,sans-serif" font-size="19">More variants mean more review. A repeatable method helps teams work through complexity without relying on hard-coded styling.</text><text x="90" y="940" fill="#7b8493" font-family="Arial,sans-serif" font-size="14">Illustrative process · generic terminology · no internal component names, token values or implementation details shown</text></svg>