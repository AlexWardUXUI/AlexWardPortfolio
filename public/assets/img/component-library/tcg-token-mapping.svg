="none"/><circle cx="1000" cy="478" r="5" fill="none" stroke="#7cc4f5" stroke-width="2"/><rect x="1130" y="454" width="290" height="48" rx="12" fill="#1b2633" stroke="#334155" stroke-width="1.5" /><text x="1146" y="476" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start" letter-spacing="0" >color.border.focus</text><text x="1146" y="494" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#7f93a8" text-anchor="start" letter-spacing="0" >#007acc</text><rect x="1384" y="468" width="20" height="20" rx="6" fill="#007acc" stroke="#475569" stroke-width="1" /><path d="M 1130 582 L 938 582" stroke="#7cc4f5" stroke-width="1.5" fill="none"/><circle cx="924" cy="582" r="5" fill="none" stroke="#7cc4f5" stroke-width="2"/><rect x="1130" y="558" width="290" height="48" rx="12" fill="#1b2633" stroke="#334155" stroke-width="1.5" /><text x="1146" y="580" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start" letter-spacing="0" >color.primary.subtle</text><text x="1146" y="598" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#7f93a8" text-anchor="start" letter-spacing="0" >#cfe6f7</text><rect x="1384" y="572" width="20" height="20" rx="6" fill="#cfe6f7" stroke="#475569" stroke-width="1" /><path d="M 1130 664 L 1014 664" stroke="#7cc4f5" stroke-width="1.5" fill="none"/><circle cx="1000" cy="664" r="5" fill="none" stroke="#7cc4f5" stroke-width="2"/><rect x="1130" y="640" width="290" height="48" rx="12" fill="#1b2633" stroke="#334155" stroke-width="1.5" /><text x="1146" y="662" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="start" letter-spacing="0" >color.primary.default</text><text x="1146" y="680" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#7f93a8" text-anchor="start" letter-spacing="0" >#007acc</text><rect x="1384" y="654" width="20" height="20" rx="6" fill="#007acc" stroke="#475569" stroke-width="1" /><text x="800" y="850" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0" >Change a token once and every component that uses it updates.</text></svg>
