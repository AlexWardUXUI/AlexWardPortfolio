<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 906" width="1600" height="906" role="img" aria-labelledby="t d"><title id="t">Tokens mapped to a component</title><desc id="d">A sample form card with callout lines from its surface, heading, muted text, spacing, corner radius, focus border, tag fill and primary button to the named design tokens that style them.</desc><rect x="0" y="0" width="1600" height="906" rx="0" fill="#0f1720" /><defs><pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15.0" cy="15.0" r="1.3" fill="#1f2b38"/></pattern></defs><rect width="1600" height="906" fill="url(#dots)"/><text x="110" y="96" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#7cc4f5" text-anchor="start" letter-spacing="2" >TOKEN MAPPING</text><text x="330" y="96" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="-0.3" >Every visual property points at a shared value</text><g filter="url(#lift)"><rect x="560" y="210" width="480" height="520" rx="20" fill="#ffffff" /></g><defs><filter id="lift" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/></filter></defs><rect x="600" y="250" width="56" height="56" rx="14" fill="#ece0f8" /><circle cx="628" cy="278" r="12" fill="#8941d1"/><text x="600" y="350" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#111111" text-anchor="start" letter-spacing="-0.5" >Create workspace</text><text x="600" y="382" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#737373" text-anchor="start" letter-spacing="0" >Invite your team and start sharing</text><text x="600" y="438" font-family="Inter, -a