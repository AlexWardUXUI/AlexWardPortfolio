<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="title desc"><desc>Four evenly spaced stages arranged around a circular clockwise loop: explore, review, refine and learn. Designer judgement is shown at the centre.</desc><defs><marker id="a" markerHeight="11" markerUnits="strokeWidth" markerWidth="11" orient="auto" refX="8" refY="5.5"><path fill="none" stroke="#8b7be0" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 8 4.5L1 10"/></marker></defs><path fill="#f7f8fa" d="M0 0h1600v1000H0z"/><text x="90" y="72" fill="#536174" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">AI ENABLEMENT · HUMAN-LED QUALITY</text><text x="90" y="132" fill="#172033" font-family="Arial,sans-serif" font-size="44" font-weight="700">A review loop that keeps exploration useful</text><text x="90" y="178" fill="#596579" font-family="Arial,sans-serif" font-size="20">AI can help generate directions; designers decide what is relevant, coherent and worth developing.</text><g fill="none" stroke="#8b7be0" stroke-linecap="round" stroke-width="4" marker-end="url(#a)"><path d="M1033 287a330 330 0 0 1 85 148"/><path d="M1118 605a330 330 0 0 1-129 185"/><path d="M611 790a330 330 0 0 1-130-185"/><path d="M481 435a330 330 0 0 1 130-185"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><rect width="280" height="140" x="660" y="190" fill="#eeeaff" stroke="#8877df" stroke-width="2" rx="23"/><circle cx="700" cy="225" r="16" fill="#8877df"/><text x="700" y="231" fill="#fff" font-size="15" font-weight="700">1</text><text x="800" y="256" fill="#252d40" font-size="22" font-weight="700">Explore</text><text x="800" y="290" fill="#596579" font-size="16">Generate possible directions</text><rect width="280" height="140" x="1060" y="450" fill="#f0f1ff" stroke="#7777d8" stroke-width="2" rx="23"/><circle cx="1100" cy="485" r="16" fill="#7777d8"/><text x="1100" y="491" fill="#fff" font-size="15" font-weight="700">2</text><text x="1200" y="516" fill="#252d40" font-size="22" font-weight="700">Review</text><text x="1200" y="550" fill="#596579" font-size="16">Check user need &amp; design fit</text><rect width="280" height="140" x="660" y="710" fill="#f1efff" stroke="#8877df" stroke-width="2" rx="23"/><circle cx="700" cy="745" r="16" fill="#8877df"/><text x="700" y="751" fill="#fff" font-size="15" font-weight="700">3</text><text x="800" y="776" fill="#252d40" font-size="22" font-weight="700">Refine</text><text x="800" y="810" fill="#596579" font-size="16">Adapt, test or discard</text><rect width="280" height="140" x="260" y="450" fill="#eaf5ef" stroke="#55a77d" stroke-width="2" rx="23"/><circle cx="300" cy="485" r="16" fill="#55a77d"/><text x="300" y="491" fill="#fff" font-size="15" font-weight="700">4</text><text x="400" y="516" fill="#252d40" font-size="22" font-weight="700">Learn</text><text x="400" y="550" fill="#596579" font-size="16">Capture insight for next time</text></g><text x="800" y="475" fill="#7664d8" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2" text-anchor="middle">HUMAN-LED</text><text x="800" y="518" fill="#172033" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">Designer</text><text x="800" y="552" fill="#596579" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">judgement at every step</text><text x="800" y="590" fill="#7b8493" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">AI supports exploration;</text><text x="800" y="613" fill="#7b8493" font-family="Arial,sans-serif" font-size="15" text-anchor="middle">people guide the decisions.</text><rect width="1420" height="58" x="90" y="885" fill="#172033" rx="17"/><text x="130" y="922" fill="#fff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Quality comes from the loop:</text><text x="420" y="922" fill="#e4e7f0" font-family="Arial,sans-serif" font-size="18">context, review, iteration and shared learning—not generation alone.</text><text x="90" y="976" fill="#7b8493" font-family="Arial,sans-serif" font-size="14">Illustrative review model · generic criteria only · no internal prompts, product screens or evaluation rules shown</text></svg>