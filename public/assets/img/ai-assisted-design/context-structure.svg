<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="title desc"><desc>An abstract model showing shared design foundations and project exploration as connected, mutually reinforcing work.</desc><path fill="#f7f8fa" d="M0 0h1600v1000H0z"/><text x="90" y="80" fill="#536174" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">DESIGN OPERATIONS · AI ENABLEMENT</text><text x="90" y="145" fill="#172033" font-family="Arial,sans-serif" font-size="46" font-weight="700">Building the conditions for better AI-assisted design</text><text x="90" y="193" fill="#596579" font-family="Arial,sans-serif" font-size="21">Shared foundations make exploration more coherent. Project learning strengthens the foundations over time.</text><rect width="640" height="535" x="90" y="270" fill="#fff" stroke="#d9d5f2" stroke-width="2" rx="28"/><rect width="640" height="104" x="90" y="270" fill="#eeeaff" rx="28"/><path fill="#eeeaff" d="M90 346v28h640v-28"/><text x="130" y="319" fill="#7664d8" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2">ONGOING FOUNDATIONS</text><text x="130" y="353" fill="#252d40" font-family="Arial,sans-serif" font-size="27" font-weight="700">Create useful shared context</text><g font-family="Arial,sans-serif"><rect width="260" height="130" x="130" y="410" fill="#f1efff" rx="20"/><circle cx="164" cy="446" r="12" fill="#8877df"/><text x="188" y="452" fill="#30364a" font-size="18" font-weight="700">Design foundations</text><text x="155" y="491" fill="#596579" font-size="16">Reusable standards and</text><text x="155" y="515" fill="#596579" font-size="16">shared patterns</text><rect width="270" height="130" x="420" y="410" fill="#f1efff" rx="20"/><circle cx="454" cy="446" r="12" fill="#8877df"/><text x="478" y="452" fill="#30364a" font-size="18" font-weight="700">Product context</text><text x="445" y="491" fill="#596579" font-size="16">Relevant knowledge about</text><text x="445" y="515"