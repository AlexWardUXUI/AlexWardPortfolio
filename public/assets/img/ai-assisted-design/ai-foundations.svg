<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="t">Foundations and exploration</title><desc id="d">Two connected panels. Ongoing foundations (design foundations, product context, team guidance, quality checks) inform project exploration (discovery, co-design, rapid concepts, review and refine), and what projects learn feeds back into the foundations.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1720"/><stop offset="1" stop-color="#16202c"/></linearGradient><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="1.4" fill="#223042"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7cc4f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#bg)" /><rect width="1600" height="900" fill="url(#dots)"/><text x="110" y="96" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#7cc4f5" text-anchor="start" letter-spacing="2">DESIGN OPERATIONS · AI ENABLEMENT</text><text x="110" y="140" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="-0.5">Building the conditions for better AI-assisted design</text><text x="110" y="174" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#b6c4d3" text-anchor="start" letter-spacing="0">Shared fou