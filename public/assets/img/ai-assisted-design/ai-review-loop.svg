<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d"><title id="t">Review loop</title><desc id="d">Four stages around a clockwise loop: explore, review, refine and learn, with designer judgement at the centre.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1720"/><stop offset="1" stop-color="#16202c"/></linearGradient><pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="16" cy="16" r="1.4" fill="#223042"/></pattern><filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7cc4f5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#bg)" /><rect width="1600" height="900" fill="url(#dots)"/><text x="110" y="96" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600" fill="#7cc4f5" text-anchor="start" letter-spacing="2">AI ENABLEMENT · HUMAN-LED QUALITY</text><text x="110" y="140" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="-0.5">A review loop that keeps exploration useful</text><text x="110" y="174" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#b6c4d3" text-anchor="start" letter-spacing="0">AI can help generate directions; designers decide what is relevant, coherent and worth developing.</text><circle cx="800" cy="572" r="262" fill="none" stroke="#3b4a5c" stroke-width="1.5" stroke-dasharray="4 8"/><path d="M 881.0 322.8 A 262 262 0 0 1 1049.2 491.0" fill="none" stroke="#7cc4f5" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 1049.2 653.0 A 262 262 0 0 1 881.0 821.2" fill="none" stroke="#7cc4f5" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 719.0 821.2 A 262 262 0 0 1 550.8 653.0" fill="none" stroke="#7cc4f5" stroke-width="2.5" marker-end="url(#arr)"/><path d="M 550.8 491.0 A 262 262 0 0 1 719.0 322.8" fill="none" stroke="#7cc4f5" stroke-width="2.5" marker-end="url(#arr)"/><rect x="660.0" y="256.0" width="280" height="108" rx="18" fill="#1b2633" stroke="#3b4a5c" stroke-width="1.4" filter="url(#sh)"/><circle cx="694.0" cy="296.0" r="15" fill="#7cc4f5"/><text x="694.0" y="301.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0f1720" text-anchor="middle" letter-spacing="0">1</text><text x="722.0" y="302.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="0">Explore</text><text x="684.0" y="340.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#b6c4d3" text-anchor="start" letter-spacing="0">Generate possible directions</text><rect x="922.0" y="518.0" width="280" height="108" rx="18" fill="#1b2633" stroke="#3b4a5c" stroke-width="1.4" filter="url(#sh)"/><circle cx="956.0" cy="558.0" r="15" fill="#7cc4f5"/><text x="956.0" y="563.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0f1720" text-anchor="middle" letter-spacing="0">2</text><text x="984.0" y="564.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="0">Review</text><text x="946.0" y="602.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#b6c4d3" text-anchor="start" letter-spacing="0">Check user need and design fit</text><rect x="660.0" y="780.0" width="280" height="108" rx="18" fill="#1b2633" stroke="#3b4a5c" stroke-width="1.4" filter="url(#sh)"/><circle cx="694.0" cy="820.0" r="15" fill="#7cc4f5"/><text x="694.0" y="825.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0f1720" text-anchor="middle" letter-spacing="0">3</text><text x="722.0" y="826.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="0">Refine</text><text x="684.0" y="864.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#b6c4d3" text-anchor="start" letter-spacing="0">Adapt, test or discard</text><rect x="398.0" y="518.0" width="280" height="108" rx="18" fill="#1b2633" stroke="#3b4a5c" stroke-width="1.4" filter="url(#sh)"/><circle cx="432.0" cy="558.0" r="15" fill="#7cc4f5"/><text x="432.0" y="563.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#0f1720" text-anchor="middle" letter-spacing="0">4</text><text x="460.0" y="564.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start" letter-spacing="0">Learn</text><text x="422.0" y="602.0" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#b6c4d3" text-anchor="start" letter-spacing="0">Capture insight for next time</text><circle cx="800" cy="572" r="104" fill="#16202c" stroke="#a98bf0" stroke-width="2"/><text x="800" y="542" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#c4b2f5" text-anchor="middle" letter-spacing="2">HUMAN-LED</text><text x="800" y="578" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0">Designer</text><text x="800" y="608" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#b6c4d3" text-anchor="middle" letter-spacing="0">judgement at</text><text x="800" y="630" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#b6c4d3" text-anchor="middle" letter-spacing="0">every step</text></svg>
